{% extends "registration/auth_base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div id="claimListReactRoot"></div>
{% if claim_list_scope_filters %}
<script>window.__CLAIM_LIST_FILTERS__ = { branches: {{ claim_list_branches_json|safe }}, advisors: {{ claim_list_advisors_json|safe }} };</script>
{% else %}
<script>window.__CLAIM_LIST_FILTERS__ = null;</script>
{% endif %}
<script>window.__CLAIM_LIST_CURRENT_ADVISOR__ = {{ claim_list_current_advisor_json|safe }};</script>
<link rel="stylesheet" href="/static/assets/claimList.css">
<script type="module" src="/static/assets/claimList.js"></script>
<style>.claim-grid-page,.claim-legacy-list{display:none!important}</style>

{% endblock %}
