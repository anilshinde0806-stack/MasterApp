{% extends "registration/auth_base.html" %}

{% block title %}Claim Entry{% endblock %}

{% block content %}

<style>
.job-grid-page {
    padding: 10px 12px;
}

.job-page-header {
    margin-bottom: 8px;
}

.job-page-header h3 {
    font-size: 1.05rem;
    font-weight: 800;
}

.job-filter-card {
    border: 1px solid #dfe5ee;
    border-radius: 8px;
    margin-bottom: 8px;
}

.job-filter-card.card {
    padding: 10px 12px !important;
}

.job-filter-card label {
    margin-bottom: 3px;
    color: #4b5563;
    font-size: .76rem;
    font-weight: 700;
}

.job-filter-card .form-control,
.job-filter-card .form-select {
    min-height: 34px;
    padding-top: 5px;
    padding-bottom: 5px;
    font-size: .86rem;
}

#jobGrid {
    height: calc(100vh - 188px);
    min-height: 520px;
    width: 100%;
    --ag-font-size: 12px;
    --ag-grid-size: 4px;
    --ag-row-height: 30px;
    --ag-header-height: 32px;
    --ag-list-item-height: 26px;
    --ag-cell-horizontal-padding: 6px;
}

#jobGrid .ag-cell {
    line-height: 29px;
}

#jobGrid .ag-header-cell-text {
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>

<div class="container-fluid job-grid-page">
    <div class="d-flex justify-content-between align-items-center job-page-header">
        <h3 class="mb-0">Job Card List</h3>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'part_order_list' %}">
            Part Order Tracking
        </a>
    </div>

    <!-- FILTER PANEL -->
    <div class="card job-filter-card">

        <div class="row">

            <div class="col-md-3">
                <label>Advisor</label>
                <select id="advisorFilter" class="form-control">
                    <option value="">All</option>
                    <option value="null">Unassigned</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>Work Progress</label>
                <select id="workProgressFilter" class="form-control">
                    <option value="">All</option>
                    <option selected>Work Not Started</option>
                    <option>Started</option>
                    <option>Work Completed</option>
                    <option>2nd Approval Pending</option>
                    <option>2nd Approval Approved</option>
                    <option>2nd Approval Rejected</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>Date From</label>
                <input type="date" id="fromDate" class="form-control">
            </div>

            <div class="col-md-3">
                <label>Date To</label>
                <input type="date" id="toDate" class="form-control">
            </div>

        </div>

    </div>

    <!-- GRID -->
    <div class="container-fluid px-2">

    <div id="jobGrid"
         class="ag-theme-quartz">
    </div>

</div>
  </div>

<script>

let gridApi;

const columnDefs = [

    {
        headerName: "Job No",
        field: "job_no",
        pinned: "left",
        filter: true,
        width: 126,
        minWidth: 112
    },

    {
        headerName: "Claim",
        field: "claim__claim_no",
        filter: true,
        width: 124
    },

    {
        headerName: "Reg No",
        field: "claim__vehicle__registration_no",
        filter: true,
        width: 112
    },

    {
        headerName: "Model",
        field: "claim__vehicle__model__name",
        width: 95
    },

    {
        headerName: "Customer",
        field: "claim__vehicle__customer__name",
        minWidth: 130,
        flex: 1
    },

    {
        headerName: "Advisor",
        field: "advisor__name",
        filter: true,
        width: 118,
        cellRenderer: params =>
            params.value ? params.value : "<span style='color:red'>Unassigned</span>"
    },

    {
        headerName: "Status",
        field: "repair_status",
        filter: true,
        width: 92,
        cellRenderer: params => {
            let color =
                params.value === "Closed" ? "green" :
                params.value === "Completed" ? "green" :
                params.value === "Open" ? "orange" :
                params.value === "Cancellation" ? "red" : "gray";

            return `<span style="color:${color};font-weight:bold">
                        ${params.value}
                    </span>`;
        }
    },

    {
        headerName: "Progress",
        field: "work_progress_status",
        width: 165,
        filter: true,
        cellRenderer: params => {
            const value = params.value || "Work Not Started";
            const cls = value.includes("2nd Approval Pending") || value.includes("2nd Approval Rejected")
                ? "bg-danger"
                : value.includes("2nd Approval Approved")
                    ? "bg-warning text-dark"
                    : value === "Work Completed"
                        ? "bg-success"
                        : value === "Work Not Started"
                            ? "bg-secondary"
                            : "bg-info text-dark";

            return `<span class="badge ${cls}">${value}</span>`;
        }
    },

    {
        headerName: "PNA",
        field: "parts_not_available_status",
        width: 108,
        filter: true,
        cellRenderer: params => {
            const value = params.value || "No PNA";
            const cls = value === "No PNA" ? "bg-success" : "bg-danger";
            return `<span class="badge ${cls}">${value}</span>`;
        }
    },

    {
        headerName: "Net Total",
        field: "grand_total",
        width: 92
    },

    {
        headerName: "Created",
        field: "created_at",
        width: 112
    }

];

const gridOptions = {

    columnDefs: columnDefs,

    pagination: true,
    paginationPageSize: 50,
    rowHeight: 30,
    headerHeight: 32,
    animateRows: false,
    suppressCellFocus: true,

    defaultColDef: {
        sortable: true,
        resizable: true,
        filter: true,
        suppressHeaderMenuButton: true,
        minWidth: 72,
        flex: 0
    },

    rowSelection: "single",

    onRowDoubleClicked: function (event) {

        let jobId = event.data.id;

        // 👉 OPEN JOB CARD EDIT PAGE
        window.location.href = `/jobCard/${jobId}/edit/`;
    }

};

document.addEventListener("DOMContentLoaded", function () {

    const gridDiv = document.querySelector("#jobGrid");

    gridApi = agGrid.createGrid(gridDiv, gridOptions);

    loadData();
});

function loadData() {
    const workProgress = document.getElementById("workProgressFilter").value;
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;
    const params = new URLSearchParams();

    if (workProgress) {
        params.set("work_progress", workProgress);
    }

    if (fromDate) {
        params.set("date_from", fromDate);
    }

    if (toDate) {
        params.set("date_to", toDate);
    }

    fetch(`/api/jobcards/?${params.toString()}`)
        .then(res => res.json())
        .then(data => {

            gridApi.setGridOption("rowData", data);
            setTimeout(() => gridApi.sizeColumnsToFit(), 0);
        });
}

window.addEventListener("resize", function () {
    if (gridApi) {
        gridApi.sizeColumnsToFit();
    }
});

document.getElementById("workProgressFilter").addEventListener("change", loadData);
document.getElementById("fromDate").addEventListener("change", loadData);
document.getElementById("toDate").addEventListener("change", loadData);

document.getElementById("advisorFilter").addEventListener("change", function () {

    let val = this.value;

    if (val === "null") {

        gridApi.setGridOption("quickFilterText", "Unassigned");

    } else {

        gridApi.setGridOption("quickFilterText", val);
    }
});
</script>

{% endblock %}
