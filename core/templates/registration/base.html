{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Body Shop Management System
        {% endblock %}
    </title>


    <!-- =========================
         BOOTSTRAP
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================
         FONT AWESOME
    ========================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        rel="stylesheet"
    >


    <!-- =========================
         TOM SELECT
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css"
        rel="stylesheet"
    >


    <!-- =========================
         EXISTING DJANGO CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/styles1.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/home.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/sidebar.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/columnCss.css' %}"
    >


    <!-- =========================
         REACT MENU CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="{% static 'assets/menu.css' %}"
    >


    <!-- =========================
         REACT HEADER CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="{% static 'assets/header.css' %}"
    >


    <!-- =========================
         REACT TOAST CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="{% static 'assets/toast.css' %}"
    >
    <link
  rel="stylesheet"
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
/>
</head>


<body class="bg-light">


    <!-- =========================
         REACT ERP HEADER
    ========================== -->

    <div id="erp-header-root"></div>


    

    <!-- =========================
         REACT GLOBAL TOAST
    ========================== -->

    <div id="react-toast-root"></div>


    <!-- =========================
         DJANGO PAGE CONTENT
    ========================== -->

    {% block content %}
    {% endblock %}


    <!-- =========================
         JAVASCRIPT LIBRARIES
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script
        src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"
    ></script>


    <script
        src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise/dist/ag-grid-enterprise.min.js"
    ></script>


    <!-- =========================
         REACT APPLICATIONS
    ========================== -->

    <script
        type="module"
        src="{% static 'assets/header.js' %}"
    ></script>


   


    <script
        type="module"
        src="{% static 'assets/toast.js' %}"
    ></script>


    <!-- =========================
         PAGE-SPECIFIC JAVASCRIPT
    ========================== -->
   <!-- DJANGO MESSAGES → REACT TOAST -->

{% if messages %}

<script>

(function () {

    const messages = [

        {% for message in messages %}

        {
            message:
                "{{ message|escapejs }}",

            type:
                "{% if message.tags == 'error' %}error{% else %}{{ message.tags }}{% endif %}"
        },

        {% endfor %}

    ];


    function sendMessagesToReactToast() {

        if (
            typeof window.showMessage !==
            "function"
        ) {

            setTimeout(
                sendMessagesToReactToast,
                50
            );

            return;

        }


        messages.forEach(function (item) {

            window.showMessage(
                item.message,
                item.type
            );

        });

    }


    sendMessagesToReactToast();

})();

</script>

{% endif %}
    {% block extra_js %}
    {% endblock %}


</body>

</html>
