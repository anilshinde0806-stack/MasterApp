{% extends "registration/auth_base.html" %}

{% block title %}Vehicle Master{% endblock %}

{% block content %}
{% load static %}

<div id="vehicle-master-root"></div>

<link rel="stylesheet" href="{% static 'VehicleMaster.css' %}">
<script type="module" src="{% static 'vehicle.js' %}"></script>

<style>
.inline-add-box {
    background: #f8f9fa;
    border: 1px dashed #0d6efd;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
}

.vehicle-modal-dialog {
    max-width: 1120px;
}

#vehicleModal .modal-content {
    border: 0;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.22);
}

#vehicleModal .modal-header {
    padding: 12px 18px;
    background: #17202a;
}

#vehicleModal .modal-title {
    font-size: 1rem;
    font-weight: 800;
}

.vehicle-modal-body {
    max-height: calc(100vh - 205px);
    overflow-y: auto;
    padding: 14px 18px 10px;
    background: #f6f8fb;
}

.vehicle-form-section {
    background: #fff;
    border: 1px solid #dfe5ee;
    border-radius: 8px;
    padding: 10px 12px 12px;
    margin-bottom: 10px;
}

.vehicle-section-title {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
    color: #1f2937;
    font-size: .82rem;
    font-weight: 800;
    text-transform: uppercase;
}

.vehicle-section-title i {
    color: #0d6efd;
}

#vehicleForm label {
    margin-bottom: 3px;
    color: #4b5563;
    font-size: .78rem;
    font-weight: 700;
}

#vehicleForm .form-control,
#vehicleForm .form-select,
#vehicleForm .ts-control {
    min-height: 36px;
    border-radius: 6px;
    font-size: .9rem;
}

#vehicleForm .btn-icon-add {
    width: 36px;
    min-width: 36px;
    height: 36px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.vehicle-modal-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: #fff;
    border-top: 1px solid #dfe5ee;
}

.vehicle-footer-note {
    color: #6b7280;
    font-size: .78rem;
}

.vehicle-master-page {
    padding: 10px 12px;
}

.vehicle-toolbar {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) auto auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}

.vehicle-toolbar .form-control,
.vehicle-toolbar .btn {
    min-height: 34px;
    padding-top: 5px;
    padding-bottom: 5px;
    font-size: .88rem;
}

#myGrid {
    height: calc(100vh - 210px);
    min-height: 520px;
    width: 100%;
    --ag-font-size: 12px;
    --ag-grid-size: 4px;
    --ag-row-height: 30px;
    --ag-header-height: 32px;
    --ag-list-item-height: 26px;
    --ag-cell-horizontal-padding: 6px;
}

#myGrid .ag-header-cell-label {
    justify-content: flex-start;
}

#myGrid .ag-header-cell-text {
    overflow: hidden;
    text-overflow: ellipsis;
}

#myGrid .ag-cell {
    line-height: 29px;
}

@media (max-width: 767px) {
    .vehicle-modal-dialog {
        margin: 8px;
    }

    .vehicle-modal-footer {
        align-items: stretch;
        flex-direction: column;
    }

    .vehicle-toolbar {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}
